<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منزّل الفيديوهات الطويلة</title>
<style>
:root{--bg:#f6f6f4;--c:#fff;--t:#1a1a1a;--m:#777;--a:#d92d20;--b:#ddd;--ok:#12805c}
@media(prefers-color-scheme:dark){:root{--bg:#151515;--c:#222;--t:#eee;--m:#999;--b:#3a3a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,Tahoma,sans-serif;padding:16px}
.w{max-width:560px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-top:14px}
input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--t);font-size:16px;margin-top:8px}
button{background:var(--a);color:#fff;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
label{display:block;margin-top:12px;color:var(--m);font-size:14px}
.bar{height:10px;background:var(--b);border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--a);transition:.4s}
ul{list-style:none;padding:0;margin:10px 0 0}li{padding:4px 0}
a.dl{display:block;text-align:center;background:var(--ok);color:#fff;padding:12px;border-radius:10px;margin-top:8px;text-decoration:none;font-weight:700}
small{color:var(--m)}summary{cursor:pointer;color:var(--m)}
</style>
</head>
<body>
<div class="w">
<h2>⬇️ منزّل الفيديوهات الطويلة</h2>

<div class="card">
<details id="set">
<summary>⚙️ الإعدادات (مرة واحدة)</summary>
<label>اسم الريبو (مثال: ahmed/ytdl)</label>
<input id="repo" dir="ltr" placeholder="username/repo">
<label>GitHub Token</label>
<input id="tok" dir="ltr" type="password" placeholder="github_pat_...">
<small>بيتحفظ في متصفح موبايلك بس.</small>
<button onclick="save()">حفظ</button>
</details>
</div>

<div class="card">
<label>رابط الفيديو</label>
<input id="url" dir="ltr" placeholder="https://youtube.com/watch?v=...">
<label>عدد الأجزاء (متساوية)</label>
<input id="parts" type="number" min="1" max="50" value="3" inputmode="numeric">
<label>الجودة</label>
<select id="q">
<option value="1080">1080p</option>
<option value="720">720p</option>
<option value="480">480p</option>
<option value="360">360p</option>
<option value="audio">صوت فقط (MP3)</option>
</select>
<button id="go" onclick="start()">ابدأ</button>
</div>

<div class="card" id="out" style="display:none">
<b id="st">جاري البدء...</b>
<div class="bar"><i id="p"></i></div>
<ul id="steps"></ul>
<div id="res"></div>
</div>
</div>

<script>
const $ = i => document.getElementById(i);
let repo = "", tok = "";
try { repo = localStorage.getItem("repo") || ""; tok = localStorage.getItem("tok") || ""; } catch (e) {}
$("repo").value = repo; $("tok").value = tok;
if (!repo || !tok) $("set").open = true;

function save() {
  repo = $("repo").value.trim(); tok = $("tok").value.trim();
  try { localStorage.setItem("repo", repo); localStorage.setItem("tok", tok); } catch (e) {}
  $("set").open = false;
}

async function gh(path, opt = {}) {
  const r = await fetch("https://api.github.com/repos/" + repo + path, {
    ...opt,
    headers: {
      Authorization: "Bearer " + tok,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      "Content-Type": "application/json"
    }
  });
  if (r.status === 204) return {};
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.message || r.status);
  return d;
}

async function start() {
  save();
  const url = $("url").value.trim();
  if (!repo || !tok) { $("set").open = true; return; }
  if (!url) { alert("حط الرابط"); return; }
  const id = Date.now().toString(36);
  $("go").disabled = true;
  $("out").style.display = "block";
  $("res").innerHTML = ""; $("steps").innerHTML = ""; $("p").style.width = "0";
  $("st").textContent = "جاري إرسال الطلب...";
  try {
    const info = await gh("");
    await gh("/actions/workflows/download.yml/dispatches", {
      method: "POST",
      body: JSON.stringify({
        ref: info.default_branch,
        inputs: { job_id: id, url, parts: String($("parts").value || 1), quality: $("q").value }
      })
    });
  } catch (e) {
    $("st").textContent = "فشل الإرسال: " + e.message;
    $("go").disabled = false; return;
  }
  $("st").textContent = "في الانتظار...";
  poll(id);
}

function poll(id) {
  const t = setInterval(async () => {
    try {
      const runs = await gh("/actions/runs?event=workflow_dispatch&per_page=15");
      const run = runs.workflow_runs.find(r => r.display_title === "dl-" + id);
      if (!run) return;
      const jobs = await gh("/actions/runs/" + run.id + "/jobs");
      const steps = ((jobs.jobs || [])[0] || {}).steps || [];
      const real = steps.filter(s => !/^(Set up job|Complete job|Post )/.test(s.name));
      const done = real.filter(s => s.status === "completed").length;
      $("p").style.width = (real.length ? Math.round(done / real.length * 100) : 5) + "%";
      $("steps").innerHTML = real.map(s => "<li>" +
        (s.status === "completed" ? (s.conclusion === "success" ? "✅" : "❌")
          : s.status === "in_progress" ? "⏳" : "⬜") + " " + s.name + "</li>").join("");
      if (run.status !== "completed") { $("st").textContent = "الشغل شغال... سيب الصفحة مفتوحة"; return; }
      clearInterval(t);
      $("go").disabled = false;
      if (run.conclusion !== "success") {
        $("st").textContent = "فشل التنفيذ ❌";
        $("res").innerHTML = '<a class="dl" style="background:var(--a)" href="' + run.html_url + '" target="_blank">شوف السبب</a>';
        return;
      }
      $("st").textContent = "تم! ✅"; $("p").style.width = "100%";
      const rel = await gh("/releases/tags/job-" + id);
      $("res").innerHTML = rel.assets.map(a =>
        '<a class="dl" href="' + a.browser_download_url + '">' + a.name +
        " (" + (a.size / 1048576).toFixed(0) + " MB)</a>").join("");
    } catch (e) { $("st").textContent = "خطأ: " + e.message; }
  }, 6000);
}
</script>
</body>
</html>
